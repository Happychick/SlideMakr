<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; color: #111827; }
      button { border: 0; background: #635BFF; color: #fff; padding: 10px 12px; margin-top: 8px; cursor: pointer; }
      button.secondary { background: #111827; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 12px; font-size: 12px; color: #4b5563; }
      #connect { display: none; margin-top: 8px; }
      a { color: #635BFF; }
    </style>
  </head>
  <body>
    <!--
      One base URL: SLIDEMAKR_BASE_URL is set once in Code.gs and passed in
      here via getAddonConfig(). To swap the backend host, change it in
      Code.gs only -- see docs/slides-addon.md.

      This sidebar runs in a cross-origin googleusercontent.com iframe, so
      our session cookie (SameSite=Lax) never reaches a fetch() made from
      here. Instead of fetching /api/addon-token directly, "Connect
      SlideMakr" opens /addon/connect as a real top-level popup -- which
      *does* carry the Lax cookie -- and that page hands the token back via
      postMessage. See docs/slides-addon.md for the full flow.
    -->
    <h3>SlideMakr</h3>
    <p id="deckName">Loading deck...</p>
    <button id="recordBtn" onclick="toggleRecording()" disabled>Tap to record</button>
    <div id="connect">
      <p>Connect SlideMakr to use voice editing from this add-on.</p>
      <button onclick="openConnect()">Connect SlideMakr</button>
    </div>
    <div id="status"></div>

    <script>
      let backendUrl = '';
      let activePresentationId = '';
      let addonToken = '';
      let mediaRecorder = null;
      let chunks = [];
      let recording = false;
      let expectedConnectState = '';

      function randomState() {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
      }

      // A postMessage with targetOrigin '*' can in principle be read by any
      // listener the opener page registers, so the raw token is never
      // trusted on its own: both the sender's origin AND the per-attempt
      // state nonce generated by this sidebar (never sent anywhere except
      // as a URL param this window itself opened) must match before the
      // token is claimed and saved. See docs/slides-addon.md.
      window.addEventListener('message', async (event) => {
        if (event.origin !== backendUrl) return;
        if (!event.data || event.data.type !== 'slidemakr-token') return;
        if (!expectedConnectState || event.data.state !== expectedConnectState) return;
        expectedConnectState = '';
        await claimAndSetToken(event.data.token, event.data.state);
      });

      google.script.run.withSuccessHandler((config) => {
        backendUrl = config.backendUrl;
        activePresentationId = config.activePresentationId;
        document.getElementById('deckName').textContent = config.presentationName;
        if (config.savedToken) {
          setToken(config.savedToken);
        } else {
          showConnectPrompt();
        }
      }).getAddonConfig();

      function setToken(token) {
        addonToken = token;
        google.script.run.saveToken(token);
        document.getElementById('connect').style.display = 'none';
        document.getElementById('recordBtn').disabled = false;
        setStatus('Ready.');
      }

      function showConnectPrompt() {
        document.getElementById('connect').style.display = 'block';
        document.getElementById('recordBtn').disabled = true;
        setStatus('Not connected.');
      }

      function openConnect() {
        expectedConnectState = randomState();
        const url = backendUrl + '/addon/connect?state=' + encodeURIComponent(expectedConnectState);
        window.open(url, 'slidemakr_connect', 'width=480,height=320');
        setStatus('Waiting for connection...');
      }

      async function claimAndSetToken(token, state) {
        setStatus('Confirming connection...');
        try {
          const res = await fetch(backendUrl + '/api/addon-token/claim', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, state })
          });
          if (!res.ok) {
            setStatus('Could not confirm connection. Try again.');
            return;
          }
          setToken(token);
        } catch (err) {
          setStatus('Could not confirm connection: ' + err.message);
        }
      }

      async function toggleRecording() {
        if (recording) {
          mediaRecorder.stop();
          return;
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((track) => track.stop());
          recording = false;
          document.getElementById('recordBtn').textContent = 'Tap to record';
          sendEdit(new Blob(chunks, { type: 'audio/webm' }));
        };
        mediaRecorder.start();
        recording = true;
        document.getElementById('recordBtn').textContent = 'Recording... tap to stop';
        setStatus('Listening...');
      }

      async function sendEdit(audioBlob) {
        if (!activePresentationId || !addonToken) return;
        setStatus('Applying...');
        const form = new FormData();
        form.append('audio', audioBlob, 'edit.webm');
        form.append('presentation_id', activePresentationId);
        try {
          const res = await fetch(backendUrl + '/edit-audio', {
            method: 'POST',
            headers: { 'X-SlideMakr-Token': addonToken },
            body: form
          });
          if (res.status === 401) {
            showConnectPrompt();
            setStatus('Connection expired. Reconnect SlideMakr.');
            return;
          }
          if (res.status === 402) {
            setStatus('Out of credits. Buy credits at ' + backendUrl);
            return;
          }
          const data = await res.json();
          if (data.success) {
            setStatus('Heard: "' + (data.transcript || '') + '" -- applied.');
          } else {
            setStatus(data.error || 'Could not apply edit.');
          }
        } catch (err) {
          setStatus('Request failed: ' + err.message);
        }
      }

      function setStatus(text) {
        document.getElementById('status').textContent = text;
      }
    </script>
  </body>
</html>
